
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа 3: Растровые алгоритмы</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

<div class="controls">
    <h2>Настройки</h2>
    <div class="input-group">
        <label>Алгоритм:</label>
        <select id="algoSelect">
            <option value="step">Пошаговый (Step)</option>
            <option value="dda">ЦДА (DDA)</option>
            <option value="bresenhamLine">Брезенхем (Линия)</option>
            <option value="bresenhamCircle">Брезенхем (Окружность)</option>
            <option value="wu">Сглаживание (Wu) [Бонус]</option>
        </select>
    </div>
    <div class="input-group">
        <label>Координаты начала (X1, Y1) / Центр:</label>
        <div style="display: flex; gap: 2px;">
            <input type="number" id="x1" value="0" placeholder="X1" style="width: 60px;">
            <input type="number" id="y1" value="0" placeholder="Y1" style="width: 60px;">
        </div>
    </div>
    <div class="input-group" id="endCoords">
        <label>Координаты конца (X2, Y2) / Радиус (R):</label>
        <div style="display: flex; gap: 2px;">
            <input type="number" id="x2" value="10" placeholder="X2/R" style="width: 60px;">
            <input type="number" id="y2" value="5" placeholder="Y2" style="width: 60px;">
        </div>
    </div>
    <div class="input-group">
        <label>Масштаб (пикселей в клетке): <span id="zoomVal">20</span></label>
        <input type="range" id="zoom" min="5" max="50" value="20">
    </div>
    <div class="input-group">
        <label>Задержка шага алгоритма (мс): <span id="latencyVal">0</span></label>
        <input type="range" id="latency" min="0" max="500" value="0" step="10">
    </div>
    <button onclick="runAlgorithm()">Построить</button>
    <button class="secondary" onclick="clearCanvas(true)">Очистить</button>
    <div class="stats" id="log">
        Время выполнения: -<br>
        Закрашено пикселей: -
    </div>
    <button id="showStepsBtn" style="margin-top:8px;">Показать шаги алгоритма</button>
    <div style="font-size: 0.8rem; color: #666; margin-top: auto;">
        ЛКМ по сетке ставит точку 1.<br>
        ПКМ по сетке ставит точку 2.
    </div>
</div>

<div class="canvas-container">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="coord-info" id="mouseCoords">X: 0, Y: 0</div>
</div>

<!-- Modal for algorithm steps log -->
<div id="stepsModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:24px; border-radius:8px; max-width:600px; max-height:80vh; overflow:auto; position:relative; box-shadow:0 2px 16px rgba(0,0,0,0.2);">
        <button id="closeStepsModal" style="position:absolute; top:8px; right:8px; font-size:1.2rem;">&times;</button>
        <h3>Шаги алгоритма</h3>
        <pre id="stepsLog" style="font-size:0.95rem; white-space:pre-wrap; word-break:break-word;"></pre>
    </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
